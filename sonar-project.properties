sonar.projectKey=YpNo_imap-rs
sonar.organization=ypno

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=imap-rs
sonar.projectVersion=1.0

# Source layout — only crate sources are scanned for issues. Tests,
# benches, fuzz harnesses, generated coverage reports, and worktree /
# build directories are excluded so they don't dilute the project's
# rule conformance score.
sonar.sources=imap-core,imap-client,imap-tls
sonar.tests=imap-core/src,imap-client/src,imap-client/tests,imap-tls/tests

sonar.exclusions=**/tests/**,**/benches/**,**/fuzz/**,**/target/**,**/.claude/**
sonar.test.exclusions=**/target/**,**/fuzz/**,**/benches/**

# Coverage report (produced by `cargo tarpaulin --out xml`); kept
# co-located with the workflow that generates it.
sonar.coverageReportPaths=cobertura.xml
sonar.coverage.exclusions=**/tests/**,**/benches/**,**/fuzz/**,**/examples/**

# Encoding of the source code. Default is default system encoding.
sonar.sourceEncoding=UTF-8
