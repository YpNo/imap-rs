[package]
name = "imap-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A high-security, memory-safe, and async-native IMAP library for Rust."
documentation = "https://docs.rs/imap-rs"
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
imap-core = { package = "imap-rs-core", path = "imap-core", version = "0.2.4" }
imap-client = { package = "imap-rs-client", path = "imap-client", version = "0.2.4" }
imap-tls = { package = "imap-rs-tls", path = "imap-tls", version = "0.2.4" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = [
    "imap-core",
    "imap-client",
    "imap-tls"
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.95.0"
authors = ["YpNo"]
license = "MIT"
repository = "https://github.com/YpNo/imap-rs"
homepage = "https://github.com/YpNo/imap-rs"
keywords = ["imap", "email", "protocol", "async"]
categories = ["email", "network-programming"]
publish = true

[workspace.dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
bytes = "1.12.1"
