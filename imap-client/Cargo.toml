[package]
name = "imap-rs-client"
description = "Async IMAP session state machine, command pipelining, and credential management. Client layer of imap-rs."
documentation = "https://docs.rs/imap-rs-client"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "imap_client"

[dependencies]
imap-core = { package = "imap-rs-core", path = "../imap-core", version = "0.2.1" }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
bytes.workspace = true
base64 = "0.22"

[features]
default = []
# RFC 6851 — `MOVE` extension. Gates `Session::move_messages`.
move_ext = []
# Feature flags for CONDSTORE (RFC 7162), QRESYNC (RFC 7162), UIDPLUS
# (RFC 4315), and other extensions are intentionally not declared yet —
# they will be added when their commands are implemented. Declaring them
# without an implementation misleads callers about what's supported.

[dev-dependencies]
trybuild = "1.0.116"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
