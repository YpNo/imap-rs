sonar.projectKey=YpNo_imap-rs
sonar.organization=ypno

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=imap-rs
sonar.projectVersion=1.0

# Source layout — scope main and test sets so they are disjoint
# (SonarCloud refuses indexing the same file twice). Each crate's
# `src/` is production code; integration test directories are scanned
# as test code. Inline `#[cfg(test)] mod tests { ... }` blocks live
# inside `src/` and are necessarily indexed as production code — that
# is unavoidable for Rust without splitting the file. Coverage from
# tarpaulin still attributes correctly because it reports per line.
sonar.sources=imap-core/src,imap-client/src,imap-tls/src
sonar.tests=imap-client/tests,imap-tls/tests

# Defensive exclusions: keep build artefacts, fuzz harnesses, benches,
# and worktree state out of every analysis pass even if the scanner
# walks above the configured roots.
sonar.exclusions=**/target/**,**/fuzz/**,**/benches/**,**/.claude/**

# Coverage report (produced by `cargo tarpaulin --out xml`).
sonar.coverageReportPaths=cobertura.xml
sonar.coverage.exclusions=**/tests/**,**/benches/**,**/fuzz/**,**/examples/**

# Encoding of the source code. Default is default system encoding.
sonar.sourceEncoding=UTF-8
