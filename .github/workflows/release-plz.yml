name: Release-plz

# release-plz manages versioning, changelogs, crates.io publishing, and GitHub
# releases for the whole workspace. It computes the publish order from the
# dependency graph automatically: imap-rs-core -> imap-rs-client ->
# imap-rs-tls -> imap-rs.
#
# Required repository secret:
#   CARGO_REGISTRY_TOKEN  — a crates.io API token with publish scope, used
#                           only by the release job.
#
# Note: PRs opened by the default GITHUB_TOKEN do NOT trigger other workflows
# (e.g. CI). To run CI on the release PR, create a fine-grained PAT or install
# the release-plz GitHub App and pass it as `token:` below instead.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Open / update the "release" PR that bumps versions and changelogs.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'YpNo' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          # No CARGO_REGISTRY_TOKEN here: opening the PR only reads the public
          # index, while this job builds every dependency (build scripts and
          # proc-macros) for cargo-semver-checks. The publish token stays in
          # the release job, the only one that publishes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Publish any crate whose version was bumped on main (i.e. when a release PR
  # is merged), then create the matching GitHub release.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'YpNo' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
