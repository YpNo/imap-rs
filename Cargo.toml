[workspace]
members = [
    "imap-core",
    "imap-client",
    "imap-tls"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["YpNo"]
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rustls = "0.23"
bytes = "1.11"
